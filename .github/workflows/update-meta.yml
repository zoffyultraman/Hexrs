name: Update Meta Data

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch CommunityDragon metadata and compute pHashes
        run: python scripts/fetch_cdragon.py --output dist/cdragon_meta.json

      - name: Build meta.db.zst and manifest.json
        run: python scripts/calc_meta.py --input dist/cdragon_meta.json --out-dir dist

      - name: Upload meta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hexrs-meta-bundle
          path: |
            dist/meta.db.zst
            dist/manifest.json
          if-no-files-found: error

      - name: Publish to data branch (optional)
        if: vars.ENABLE_DATA_BRANCH_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:data
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp -f dist/meta.db.zst meta.db.zst
          cp -f dist/manifest.json manifest.json
          git add meta.db.zst manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update meta.db.zst and manifest.json"
            git push origin data
          fi
