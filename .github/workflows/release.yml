name: Release HexOverlay (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUSTFLAGS: "-C target-feature=+crt-static"
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC & Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate fxc.exe for GPUI
        shell: pwsh
        run: |
          $fxc = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) {
            Write-Error "Failed to locate fxc.exe under C:\Program Files (x86)\Windows Kits\10\bin\*\x64"
            exit 1
          }
          Write-Host "Using GPUI_FXC_PATH=$($fxc.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "GPUI_FXC_PATH=$($fxc.FullName)"

      - name: Cache Cargo dependencies and artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build HexOverlay release binary
        run: cargo build --release --bin HexOverlay

      - name: Report HexOverlay.exe size
        shell: pwsh
        run: |
          $exe = Get-Item "target/release/HexOverlay.exe"
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "HexOverlay.exe size: $($exe.Length) bytes ($mb MB)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/HexOverlay.exe
          generate_release_notes: true
