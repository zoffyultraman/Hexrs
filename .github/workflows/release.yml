name: Release HexOverlay (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Bundle aramhex+CDragon meta.db.zst
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist, crates/hex-data/assets | Out-Null
          python scripts/fetch_cdragon.py --output dist/cdragon_meta.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/calc_meta.py --input dist/cdragon_meta.json --out-dir crates/hex-data/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC & Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate fxc.exe for GPUI
        shell: pwsh
        run: |
          $fxc = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) {
            Write-Error "Failed to locate fxc.exe under C:\Program Files (x86)\Windows Kits\10\bin\*\x64"
            exit 1
          }
          Write-Host "Using GPUI_FXC_PATH=$($fxc.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "GPUI_FXC_PATH=$($fxc.FullName)"

      - name: Cache Cargo dependencies and artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build HexOverlay release binary
        run: cargo build --release --target x86_64-pc-windows-msvc --bin HexOverlay

      - name: Report HexOverlay.exe size
        shell: pwsh
        run: |
          $exe = Get-Item "target/x86_64-pc-windows-msvc/release/HexOverlay.exe"
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "HexOverlay.exe size: $($exe.Length) bytes ($mb MB)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/HexOverlay.exe
          generate_release_notes: true
