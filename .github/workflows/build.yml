name: Build Hexrs (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Bundle aramhex+CDragon meta.db.zst
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist, crates/hex-data/assets | Out-Null
          python scripts/fetch_cdragon.py --output dist/cdragon_meta.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/calc_meta.py --input dist/cdragon_meta.json --out-dir crates/hex-data/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC & Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate fxc.exe for GPUI
        shell: pwsh
        run: |
          $fxc = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) {
            Write-Error "Failed to locate fxc.exe under C:\Program Files (x86)\Windows Kits\10\bin\*\x64"
            exit 1
          }
          Write-Host "Using GPUI_FXC_PATH=$($fxc.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "GPUI_FXC_PATH=$($fxc.FullName)"

      - name: Cache Cargo dependencies and artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve build version metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $appVersion = (git describe --tags --abbrev=7 --always 2>$null | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($appVersion)) {
            $appVersion = "v0.0.1"
          } else {
            $appVersion = $appVersion.Trim()
          }
          $gitSha = (git rev-parse --short=7 HEAD 2>$null | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($gitSha)) {
            $gitSha = "unknown"
          } else {
            $gitSha = $gitSha.Trim()
          }
          Write-Host "HEXRS_APP_VERSION=$appVersion"
          Write-Host "HEXRS_GIT_SHA=$gitSha"
          Add-Content -Path $env:GITHUB_ENV -Value "HEXRS_APP_VERSION=$appVersion"
          Add-Content -Path $env:GITHUB_ENV -Value "HEXRS_GIT_SHA=$gitSha"
          exit 0

      - name: Build workspace release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cargo build --release --workspace --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content -Path build.log -ErrorAction SilentlyContinue |
              ForEach-Object { $_ -replace '\x1b\[[0-9;]*[mK]', '' }
            $matched = @($lines | Where-Object {
              $_ -match 'error(\[E\d+\])?:|panicked at|fatal error|LNK\d+|cannot find|mismatched types|unresolved|failed to run custom build'
            } | Select-Object -First 8)
            if ($matched.Count -eq 0) {
              $matched = @($lines | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -Last 8)
            }
            foreach ($line in $matched) {
              Write-Host "::error::$($line)"
            }
            exit $code
          }

      - name: Report Hexrs.exe size
        shell: pwsh
        run: |
          $exe = Get-Item "target/x86_64-pc-windows-msvc/release/Hexrs.exe"
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Hexrs.exe size: $($exe.Length) bytes ($mb MB)"

      - name: Upload Hexrs artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hexrs-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/Hexrs.exe
          if-no-files-found: error
